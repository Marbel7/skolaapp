<script>
const frame=document.getElementById('app');

 const d=frame.contentDocument;
 const css=d.createElement('style');css.textContent=`
 @media(max-width:700px){
  :root{--m-primary:#6C5CE7;--m-primary-soft:#F0EEFF;--m-bg:#F7F7FA;--m-surface:#fff;--m-border:#E8E8F0;--m-ink:#202033;--m-muted:#7C8198}
  body{padding:0 0 calc(92px + env(safe-area-inset-bottom))!important;background:var(--m-bg)!important;overflow-x:hidden!important}
  .nav{display:none!important}.page{max-width:none!important;padding:18px 14px 30px!important}.page-hdr{display:none!important}.stats{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}.stat{padding:12px 10px!important;border-radius:14px!important}.stat-val{font-size:20px!important}.grid2{grid-template-columns:1fr!important;gap:10px!important}.card{border-radius:16px!important;padding:14px!important}
  .mp-bottom{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:70px;background:rgba(255,255,255,.96);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(232,232,240,.95);border-radius:23px;box-shadow:0 12px 38px rgba(32,32,51,.14);z-index:9999;display:grid;grid-template-columns:1fr 1fr 1.15fr 1fr 1fr;align-items:end;padding:0 5px 6px}

  .mp-rec{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid #E8E8F0;border-radius:14px;background:#FCFCFE;cursor:pointer}.mp-rec.on{border-color:#E7DFFF;background:#F7F5FF}.mp-mi{width:38px;height:38px;border-radius:12px;background:#F0EEFF;color:#6C5CE7;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.mp-rec.on .mp-mi{background:#6C5CE7;color:#fff}.mp-copy strong{display:block;font:700 12px Inter,sans-serif;color:#202033}.mp-copy span{display:block;font:11px Inter,sans-serif;color:#7C8198;margin-top:2px}.mp-time{margin-left:auto;font:700 11px ui-monospace,SFMono-Regular,monospace;color:#6C5CE7;display:none}.mp-rec.on .mp-time{display:block}.mp-live{display:none;align-items:center;gap:7px;margin:8px 0;color:#6C5CE7;font:700 11px Inter,sans-serif}.mp-live.on{display:flex}.mp-dot{width:7px;height:7px;border-radius:50%;background:#6C5CE7;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.35}}
  .mp-text{width:100%;min-height:100px;max-height:190px;box-sizing:border-box;margin-top:10px;border:1px solid #E8E8F0;border-radius:15px;padding:13px;font:500 16px/1.45 Inter,sans-serif;outline:none;resize:none;color:#202033;background:#fff}.mp-text:focus{border-color:#6C5CE7;box-shadow:0 0 0 3px #F0EEFF}.mp-actions{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:10px}.mp-actions button{height:48px;border-radius:13px;border:1px solid #E8E8F0;font:700 14px Inter,sans-serif}.mp-save{background:#6C5CE7;color:#fff;border-color:#6C5CE7!important}.mp-msg{display:none;margin-top:9px;padding:9px 11px;border-radius:11px;background:#FFF7E9;color:#9A671A;font:500 11px/1.35 Inter,sans-serif}.mp-msg.on{display:block}.mp-hint{font:10px Inter,sans-serif;color:#A8ABBE;text-align:center;margin-top:9px}
 }
 @media(min-width:701px){.mp-bottom,.mp-overlay{display:none!important}}
 `;d.head.appendChild(css);
 const icons={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></svg>',material:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',evidence:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 3h12v18H6z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>',settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3.5l1.1 2.6 2.8.7 2.4-1.2-1.2 2.4.7 2.8 2.6 1.1v2l-2.6 1.1-.7 2.8 1.2 2.4-1.4 1.4-2.4-1.2-2.8.7-1.1 2.6h-2l-1.1-2.6-2.8-.7-2.4 1.2-1.4-1.4 1.2-2.4-.7-2.8-2.6-1.1v-2l2.6-1.1.7-2.8-1.2-2.4 1.4-1.4 2.4 1.2 2.8-.7 1.1-2.6z"/></svg>',mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>'};
 const nav=d.createElement('nav');nav.className='mp-bottom';nav.innerHTML='<button class="mp-btn active" data-p="dashboard">'+icons.home+'<span>Přehled</span></button><button class="mp-btn" data-p="materials">'+icons.material+'<span>Materiály</span></button><div class="mp-fab-wrap"><button class="mp-fab" id="mpMic">'+icons.mic+'<span class="mp-label">Zachytit</span></button></div><button class="mp-btn" data-p="evidence">'+icons.evidence+'<span>Evidence</span></button><button class="mp-btn" data-p="settings">'+icons.settings+'<span>Nastavení</span></button>';d.body.appendChild(nav);
 const ov=d.createElement('div');ov.className='mp-overlay';ov.innerHTML='<div class="mp-sheet"><div class="mp-grab"></div><div class="mp-title">Rychlé zachycení</div><div class="mp-sub">Řekni nebo napiš, co si nechceš nechat utéct.</div><div class="mp-mode"><button class="on" id="mpTask">Úkol</button><button id="mpNote">Myšlenka</button></div><div class="mp-rec" id="mpRec"><div class="mp-mi">'+icons.mic+'</div><div class="mp-copy"><strong id="mpRecTitle">Namluvit</strong><span id="mpRecCopy">Klepni a začni mluvit</span></div><span class="mp-time" id="mpTime">0:00</span></div><div class="mp-live" id="mpLive"><span class="mp-dot"></span><span>Poslouchám… přepis se tvoří průběžně</span></div><textarea class="mp-text" id="mpText" placeholder="Např. zkontrolovat rozvrh 6.B…"></textarea><div class="mp-actions"><button id="mpCancel">Zrušit</button><button class="mp-save" id="mpSave">Uložit</button></div><div class="mp-msg" id="mpMsg"></div><div class="mp-hint">Po zastavení se řeč převede na upravitelný text. Nic se neuloží bez potvrzení.</div></div>';d.body.appendChild(ov);
 const text=ov.querySelector('#mpText'),recBtn=ov.querySelector('#mpRec'),msg=ov.querySelector('#mpMsg'),live=ov.querySelector('#mpLive'),rt=ov.querySelector('#mpRecTitle'),rc=ov.querySelector('#mpRecCopy'),tm=ov.querySelector('#mpTime');let recognition=null,recording=false,started=0,timer=null,finalText='',mode='task';
 const setMode=m=>{mode=m;ov.querySelector('#mpTask').classList.toggle('on',m==='task');ov.querySelector('#mpNote').classList.toggle('on',m==='note');text.placeholder=m==='task'?'Např. zkontrolovat rozvrh 6.B…':'Např. nápad na poradu, co nesmím zapomenout…'};ov.querySelector('#mpTask').onclick=()=>setMode('task');ov.querySelector('#mpNote').onclick=()=>setMode('note');
 const setUI=on=>{recording=on;recBtn.classList.toggle('on',on);live.classList.toggle('on',on);rt.textContent=on?'Poslouchám…':'Namluvit';rc.textContent=on?'Klepni znovu pro zastavení':'Klepni a začni mluvit';if(on){started=Date.now();tm.textContent='0:00';timer=setInterval(()=>{let s=Math.floor((Date.now()-started)/1000);tm.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250)}else{clearInterval(timer);timer=null}};
 const stop=()=>{if(recognition){try{recognition.stop()}catch(e){}recognition=null}setUI(false)};
 const start=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){msg.textContent='Tento prohlížeč nepodporuje živý hlasový přepis.';msg.classList.add('on');return}msg.classList.remove('on');recognition=new SR();recognition.lang='cs-CZ';recognition.continuous=true;recognition.interimResults=true;finalText=text.value.trim();if(finalText)finalText+=' ';recognition.onstart=()=>setUI(true);recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalText+=r[0].transcript+' ';else interim+=r[0].transcript}text.value=(finalText+interim).trim()};recognition.onerror=e=>{setUI(false);msg.textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?'Mikrofon nebyl povolen. Povol mikrofon pro tuto stránku.':'Hlasový vstup skončil s chybou: '+e.error;msg.classList.add('on')};recognition.onend=()=>{if(recording)setUI(false)};try{recognition.start()}catch(e){setUI(false);msg.textContent='Hlasový vstup se nepodařilo spustit. Zkus to znovu.';msg.classList.add('on')}};
 recBtn.onclick=()=>recording?stop():start();
 ov.querySelector('#mpMic').onclick=()=>{ov.classList.add('open');setMode(mode);setTimeout(()=>text.focus(),100)};
 ov.querySelector('#mpCancel').onclick=()=>{stop();ov.classList.remove('open');text.value='';finalText='';msg.classList.remove('on')};ov.addEventListener('click',e=>{if(e.target===ov)ov.querySelector('#mpCancel').click()});
 ov.querySelector('#mpSave').onclick=()=>{const v=text.value.trim();if(!v)return;const taskInput=d.getElementById('taskInput'),taskAdd=d.getElementById('taskAddBtn'),noteInput=d.getElementById('noteDraft'),noteAdd=d.getElementById('saveNoteBtn');if(mode==='task'&&taskInput&&taskAdd){taskInput.value=v;taskAdd.click()}else if(mode==='note'&&noteInput&&noteAdd){noteInput.value=v;noteAdd.click()}stop();ov.querySelector('#mpCancel').click()};
 nav.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{nav.querySelectorAll('.mp-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');const t=d.querySelector('.ntab[data-page="'+b.dataset.p+'"]');if(t)t.click()});
 });
