<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F7FA"><title>SkolaApp — mobilní verze</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#f7f7fa}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="mobile" src="mobile-production.html" allow="microphone"></iframe><script>
const outer=document.getElementById('mobile');
outer.addEventListener('load',()=>{
 const prod=outer.contentDocument;
 const app=prod.getElementById('app');
 const apply=()=>{
  const d=app.contentDocument;if(!d)return;
  const s=d.createElement('style');s.textContent=`
  @media(max-width:700px){
   /* Dashboard: Úkoly → Poznámky → Rychlé odkazy */
   #page-dashboard > div:nth-of-type(2)>div:first-child{display:flex!important;flex-direction:column!important}
   #page-dashboard > div:nth-of-type(2)>div:first-child>.grid2{display:contents!important}
   #page-dashboard > div:nth-of-type(2)>div:first-child>.grid2>.card:first-child{order:3!important}
   #page-dashboard > div:nth-of-type(2)>div:first-child>.grid2>.card:last-child{order:1!important}
   #page-dashboard > div:nth-of-type(2)>div:first-child>.card{order:2!important}
   /* Bottom navigation: one aligned surface, 5 equal positions */
   .mp-bottom{left:10px!important;right:10px!important;bottom:calc(8px + env(safe-area-inset-bottom))!important;height:72px!important;padding:0 4px!important;display:grid!important;grid-template-columns:repeat(5,1fr)!important;align-items:stretch!important;border-radius:24px!important}
   .mp-btn{height:58px!important;margin-top:8px!important;width:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:4px!important;padding:0!important}
   .mp-fab-wrap{height:72px!important;display:flex!important;align-items:flex-start!important;justify-content:center!important;position:relative!important}
   .mp-fab{margin-top:-18px!important;width:64px!important;height:64px!important;border-radius:22px!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:0!important}
   .mp-fab svg{width:28px!important;height:28px!important}
   .mp-label{top:68px!important;bottom:auto!important}
  }
  `;d.head.appendChild(s);
 };
 if(app.contentDocument&&app.contentDocument.readyState==='complete')apply();else app.addEventListener('load',apply,{once:true});
});
</script></body></html>
