<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F7FA">
<title>SkolaApp — mobilní aplikace</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#f7f7fa}iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" allow="microphone" src="index.html"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
const d=frame.contentDocument;
const css=d.createElement('style');
css.textContent=`
@media(max-width:700px){
body{padding:0 0 calc(94px + env(safe-area-inset-bottom))!important;overflow-x:hidden!important}
.nav-tabs,.nav-name,.nav-bell{display:none!important}
.nav{height:58px!important;padding:0 16px!important;position:sticky!important;top:0!important;z-index:9980!important}
.nav-logo{margin-right:0!important}.nav-right{margin-left:auto!important}
.page{max-width:none!important;padding:20px 14px 28px!important}
.stats{grid-template-columns:repeat(3,1fr)!important;gap:8px!important}
.grid2{grid-template-columns:1fr!important}.card{border-radius:14px!important}
.sc-bottom{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:70px;background:rgba(255,255,255,.95);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid #e8e8f0;border-radius:23px;box-shadow:0 12px 38px rgba(32,32,51,.14);z-index:9990;display:grid;grid-template-columns:1fr 1fr 1.15fr 1fr 1fr;align-items:end;padding:0 5px 6px}
.sc-btn{height:52px;border:0;background:transparent;color:#7c8198;font:600 10px Inter,-apple-system,BlinkMacSystemFont,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}.sc-btn svg{width:21px;height:21px;stroke:currentColor}.sc-btn.active{color:#6c5ce7}
.sc-fab-wrap{height:76px;display:flex;justify-content:center;align-items:flex-start}.sc-fab{margin-top:-19px!important;width:62px!important;height:62px!important;border-radius:21px!important;background:#6c5ce7!important;color:#fff!important;box-shadow:0 10px 24px rgba(108,92,231,.32)!important;display:flex!important;align-items:center!important;justify-content:center!important}.sc-fab svg{width:27px!important;height:27px!important}.sc-fab-label{position:absolute;bottom:1px;color:#6c5ce7;font:700 10px Inter,sans-serif;white-space:nowrap}
.sc-capture{position:fixed;inset:0;background:rgba(20,20,35,.46);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:10000;display:none;align-items:flex-end;justify-content:center}.sc-capture.open{display:flex}.sc-sheet{width:100%;max-width:560px;background:#fff;border-radius:28px 28px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -18px 60px rgba(0,0,0,.2)}.sc-grab{width:38px;height:4px;background:#dad ae5;border-radius:9px;margin:0 auto 15px}.sc-title{font:700 20px Inter,-apple-system,sans-serif;color:#202033}.sc-sub{font:13px Inter,-apple-system,sans-serif;color:#7c8198;margin:4px 0 15px}.sc-mode{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#f4f4f8;padding:4px;border-radius:13px;margin-bottom:11px}.sc-mode button{height:38px;border:0;border-radius:10px;background:transparent;color:#7c8198;font:700 12px Inter,sans-serif}.sc-mode button.active{background:#fff;color:#6c5ce7;box-shadow:0 1px 5px rgba(32,32,51,.08)}
.sc-voice{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid #e8e8f0;border-radius:14px;margin-bottom:10px;background:#fcfcfe}.sc-voice.recording{border-color:#d9d1ff;background:#f7f5ff}.sc-voice-icon{width:38px;height:38px;border-radius:12px;background:#f0eeff;color:#6c5ce7;display:flex;align-items:center;justify-content:center}.sc-voice.recording .sc-voice-icon{background:#6c5ce7;color:#fff}.sc-voice-copy strong{display:block;font:700 12px Inter,sans-serif;color:#202033}.sc-voice-copy span{display:block;font:11px Inter,sans-serif;color:#7c8198;margin-top:2px}.sc-live{display:none;color:#6c5ce7;font:700 11px Inter,sans-serif;margin:-2px 0 8px}.sc-live.on{display:block}.sc-text{width:100%;min-height:100px;box-sizing:border-box;border:1px solid #e8e8f0;border-radius:15px;padding:13px;font:500 16px/1.45 Inter,sans-serif;outline:0;resize:none}.sc-text:focus{border-color:#6c5ce7;box-shadow:0 0 0 3px #f0eeff}.sc-actions{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:10px}.sc-actions button{height:48px;border-radius:13px;border:1px solid #e8e8f0;font:700 14px Inter,sans-serif}.sc-save{background:#6c5ce7;color:#fff;border-color:#6c5ce7!important}.sc-permission{display:none;margin-top:9px;padding:9px 11px;border-radius:11px;background:#fff7e9;color:#9a671a;font:500 10px/1.35 Inter,sans-serif}.sc-permission.on{display:block}.sc-hint{font:10px Inter,sans-serif;color:#a8abbe;text-align:center;margin-top:9px}
}
@media(min-width:701px){.sc-bottom,.sc-capture{display:none!important}}
`;
d.head.appendChild(css);
const svg={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></svg>',material:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',evidence:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 3h12v18H6z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>',settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3.5l1.1 2.6 2.8.7 2.4-1.2 1.4 1.4-1.2 2.4.7 2.8 2.6 1.1v2l-2.6 1.1-.7 2.8 1.2 2.4-1.4 1.4-2.4-1.2-2.8.7-1.1 2.6h-2l-1.1-2.6-2.8-.7-2.4 1.2-1.4-1.4 1.2-2.4-.7-2.8L.5 14.5v-2l2.6-1.1-.7-2.8L4 4.8l2.4 1.2 2.8-.7 1.1-2.6z"/></svg>',mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>'};
const nav=d.createElement('nav');nav.className='sc-bottom';nav.innerHTML=`<button class="sc-btn active" data-p="dashboard">${svg.home}<span>Přehled</span></button><button class="sc-btn" data-p="materials">${svg.material}<span>Materiály</span></button><div class="sc-fab-wrap"><button class="sc-btn sc-fab" id="sc-mic">${svg.mic}<span class="sc-fab-label">Zachytit</span></button></div><button class="sc-btn" data-p="evidence">${svg.evidence}<span>Evidence</span></button><button class="sc-btn" data-p="settings">${svg.settings}<span>Nastavení</span></button>`;d.body.appendChild(nav);
const ov=d.createElement('div');ov.className='sc-capture';ov.innerHTML=`<div class="sc-sheet"><div class="sc-grab"></div><div class="sc-title">Rychlé zachycení</div><div class="sc-sub">Řekni nebo napiš, co si nechceš nechat utéct.</div><div class="sc-mode"><button class="active" id="sc-task">Úkol</button><button id="sc-note">Myšlenka</button></div><div class="sc-voice" id="sc-voice"><div class="sc-voice-icon">${svg.mic}</div><div class="sc-voice-copy"><strong id="sc-voice-title">Namluvit</strong><span id="sc-voice-copy">Klepni a řekni to vlastními slovy</span></div></div><div class="sc-live" id="sc-live">● Poslouchám… přepis se tvoří průběžně</div><textarea class="sc-text" id="sc-text" placeholder="Např. zkontrolovat rozvrh 6.B…"></textarea><div class="sc-actions"><button id="sc-cancel">Zrušit</button><button class="sc-save" id="sc-save">Uložit</button></div><div class="sc-permission" id="sc-permission"></div><div class="sc-hint">Hlas se po zastavení převede na upravitelný text.</div></div>`;d.body.appendChild(ov);
const text=ov.querySelector('#sc-text'),voice=ov.querySelector('#sc-voice'),live=ov.querySelector('#sc-live'),permission=ov.querySelector('#sc-permission');let mode='task',recognition=null,recording=false,finalTranscript='';
function setMode(m){mode=m;ov.querySelector('#sc-task').classList.toggle('active',m==='task');ov.querySelector('#sc-note').classList.toggle('active',m==='note');text.placeholder=m==='task'?'Např. zkontrolovat rozvrh 6.B…':'Např. nápad na poradu, co nesmím zapomenout…'}
ov.querySelector('#sc-task').onclick=()=>setMode('task');ov.querySelector('#sc-note').onclick=()=>setMode('note');
function stop(){if(recognition){try{recognition.stop()}catch(e){}recognition=null}recording=false;voice.classList.remove('recording');live.classList.remove('on');ov.querySelector('#sc-voice-title').textContent='Namluvit';ov.querySelector('#sc-voice-copy').textContent='Klepni a řekni to vlastními slovy'}
function start(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){permission.textContent='Tento prohlížeč nepodporuje živý hlasový přepis. Otevři stránku přímo v Safari/Chrome.';permission.classList.add('on');return}permission.classList.remove('on');recognition=new SR();recognition.lang='cs-CZ';recognition.continuous=true;recognition.interimResults=true;finalTranscript=text.value.trim();if(finalTranscript)finalTranscript+=' ';recognition.onstart=()=>{recording=true;voice.classList.add('recording');live.classList.add('on');ov.querySelector('#sc-voice-title').textContent='Poslouchám…';ov.querySelector('#sc-voice-copy').textContent='Klepni znovu a zastav nahrávání'};recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalTranscript+=r[0].transcript+' ';else interim+=r[0].transcript}text.value=(finalTranscript+interim).trim()};recognition.onerror=e=>{stop();permission.textContent=e.error==='not-allowed'||e.error==='service-not-allowed'?'Mikrofon nebyl povolen. Povol mikrofon pro tento web.':'Hlasový vstup skončil s chybou: '+e.error;permission.classList.add('on')};recognition.onend=()=>{if(recording)stop()};try{recognition.start()}catch(e){stop();permission.textContent='Hlasový vstup se nepodařilo spustit. Zkus to znovu.';permission.classList.add('on')}}
voice.onclick=()=>recording?stop():start();nav.querySelector('#sc-mic').onclick=()=>{ov.classList.add('open');text.focus()};ov.querySelector('#sc-cancel').onclick=()=>{stop();ov.classList.remove('open');text.value='';finalTranscript='';permission.classList.remove('on')};ov.addEventListener('click',e=>{if(e.target===ov)ov.querySelector('#sc-cancel').click()});ov.querySelector('#sc-save').onclick=()=>{const v=text.value.trim();if(!v)return;const input=mode==='task'?d.getElementById('taskInput'):d.getElementById('noteDraft');const button=mode==='task'?d.getElementById('taskAddBtn'):d.getElementById('saveNoteBtn');if(input&&button){input.value=v;button.click()}ov.querySelector('#sc-cancel').click()};
nav.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{nav.querySelectorAll('.sc-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');const t=d.querySelector('.ntab[data-page="'+b.dataset.p+'"]');if(t)t.click()});
});
</script>
</body>
</html>
