<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkolaApp preview</title><style>html,body{margin:0;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="index.html"></iframe><script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  const s=d.createElement('style');s.textContent=`
@media(max-width:600px){body{padding-bottom:88px!important}.sc-bottom{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));height:68px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border:1px solid #E8E8F0;border-radius:24px;box-shadow:0 12px 36px rgba(32,32,51,.14);z-index:9990;display:flex;align-items:center;justify-content:space-around}.sc-btn{border:0;background:none;color:#7C8198;font:600 11px Inter,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px}.sc-btn svg{width:22px;height:22px}.sc-fab{width:58px;height:58px;border-radius:20px;background:#6C5CE7;color:#fff;box-shadow:0 8px 22px rgba(108,92,231,.35);margin-top:-24px}.sc-fab svg{width:25px;height:25px}.sc-capture{position:fixed;inset:0;background:rgba(20,20,35,.42);backdrop-filter:blur(8px);z-index:10000;display:none;align-items:flex-end;justify-content:center}.sc-capture.open{display:flex}.sc-sheet{width:100%;max-width:560px;background:#fff;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -16px 50px rgba(0,0,0,.18)}.sc-title{font:700 18px Inter,-apple-system,sans-serif;color:#202033;margin-bottom:4px}.sc-sub{font:400 13px Inter,-apple-system,sans-serif;color:#7C8198;margin-bottom:14px}.sc-text{width:100%;min-height:86px;border:1px solid #E8E8F0;border-radius:16px;padding:13px;box-sizing:border-box;font:500 16px Inter,-apple-system,sans-serif;resize:none;outline:none}.sc-actions{display:flex;gap:8px;margin-top:10px}.sc-actions button{flex:1;height:46px;border-radius:13px;border:1px solid #E8E8F0;font:600 14px Inter,-apple-system,sans-serif}.sc-save{background:#6C5CE7;color:#fff;border-color:#6C5CE7!important}.sc-mode{display:flex;gap:8px;margin-bottom:12px}.sc-mode button{height:36px;padding:0 14px;border-radius:999px;border:1px solid #E8E8F0;background:#F4F4F8;color:#7C8198;font:600 12px Inter,-apple-system,sans-serif}.sc-mode button.active{background:#F0EEFF;color:#6C5CE7;border-color:#D9D4FF}}
@media(min-width:601px){.sc-bottom,.sc-capture{display:none!important}}`;
  d.head.appendChild(s);
  const n=d.createElement('nav');n.className='sc-bottom';n.innerHTML=`<button class="sc-btn" data-p="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Přehled</button><button class="sc-btn" data-p="materials"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Materiály</button><button class="sc-btn sc-fab" id="sc-mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button><button class="sc-btn" data-p="evidence"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18H6z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>Evidence</button><button class="sc-btn" data-p="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.5 3.1 3.4.5-2.5 2.4.6 3.4L12 11l-3 1.4.6-3.4-2.5-2.4 3.4-.5z"/></svg>Nastavení</button>`;d.body.appendChild(n);
  const ov=d.createElement('div');ov.className='sc-capture';ov.innerHTML=`<div class="sc-sheet"><div class="sc-title">Rychlé zachycení</div><div class="sc-sub">Řekni nebo napiš, co si nechceš nechat utéct.</div><div class="sc-mode"><button class="active" id="sc-task">Úkol</button><button id="sc-note">Myšlenka</button></div><textarea class="sc-text" id="sc-text" placeholder="Např. zkontrolovat rozvrh 6.B…"></textarea><div class="sc-actions"><button id="sc-cancel">Zrušit</button><button class="sc-save" id="sc-save">Uložit</button></div></div>`;d.body.appendChild(ov);
  const text=ov.querySelector('#sc-text');let mode='task';
  ov.querySelector('#sc-task').onclick=()=>{mode='task';ov.querySelector('#sc-task').classList.add('active');ov.querySelector('#sc-note').classList.remove('active');text.placeholder='Např. zkontrolovat rozvrh 6.B…';text.focus()};
  ov.querySelector('#sc-note').onclick=()=>{mode='note';ov.querySelector('#sc-note').classList.add('active');ov.querySelector('#sc-task').classList.remove('active');text.placeholder='Např. nápad na poradu, co nesmím zapomenout…';text.focus()};
  ov.querySelector('#sc-cancel').onclick=()=>{ov.classList.remove('open');};
  ov.querySelector('#sc-save').onclick=()=>{const v=text.value.trim();if(!v)return;if(mode==='task'){const inp=d.getElementById('taskInput');inp.value=v;d.getElementById('taskAddBtn').click();}else{const inp=d.getElementById('noteDraft');inp.value=v;d.getElementById('saveNoteBtn').click();}text.value='';ov.classList.remove('open')};
  n.querySelector('#sc-mic').onclick=()=>{ov.classList.add('open');text.focus();};
  n.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const t=d.querySelector('.ntab[data-page="'+b.dataset.p+'"]');if(t)t.click()});
});</script></body></html>
