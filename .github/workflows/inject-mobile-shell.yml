name: Inject mobile shell

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject mobile enhancement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'mobile-enhancement.js'
          if marker in s:
              raise SystemExit(0)
          tag = '<script src="mobile-enhancement.js"></script>\n'
          pos = s.lower().rfind('</body>')
          if pos < 0:
              raise SystemExit('No closing body tag found')
          s = s[:pos] + tag + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit injection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: enable native mobile quick capture"
          git push
