name: Apply hamburger design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject native mobile shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'mobile-enhancement.js'
          if marker not in s:
              tag = '<script src="mobile-enhancement.js"></script>\n'
              lower = s.lower()
              pos = lower.rfind('</body>')
              if pos < 0:
                  pos = lower.rfind('</html>')
              if pos < 0:
                  raise SystemExit('No closing html tag found')
              s = s[:pos] + tag + s[pos:]
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit mobile shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Mobile shell already active"
            exit 0
          fi
          git commit -m "feat: enable native mobile quick capture"
          git push
