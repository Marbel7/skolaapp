name: Apply hamburger design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject mobile UI scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="mobile-enhancement.js"></script>\n',
              '<script src="hamburger-modern.js"></script>\n',
          ]
          lower = s.lower()
          pos = lower.rfind('</body>')
          if pos < 0:
              pos = lower.rfind('</html>')
          if pos < 0:
              raise SystemExit('No closing html tag found')
          additions = ''.join(tag for tag in tags if tag not in s)
          if additions:
              s = s[:pos] + additions + s[pos:]
              p.write_text(s, encoding='utf-8')
          PY

      - name: Fix task interactions
        run: python3 fix_tasks.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: make tasks interactive"
          git push
