name: Validate mobile UI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate mobile scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          required = [
              'mobile-enhancement.js',
              'hamburger-modern.js',
              'task-engine.js',
          ]
          missing = [x for x in required if x not in index]
          if missing:
              raise SystemExit('Missing mobile script tags: ' + ', '.join(missing))

          mobile = Path('mobile-enhancement.js').read_text(encoding='utf-8')
          forbidden = ['signInWithRedirect', 'fbSignIn', 'firebase.auth']
          found = [x for x in forbidden if x in mobile]
          if found:
              raise SystemExit('mobile-enhancement.js contains auth override(s): ' + ', '.join(found))

          print('Mobile UI validation passed; authentication remains in index.html.')
          PY
