name: Validate mobile UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix empty Firestore task snapshot race
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """  fbUserDoc('tasks').orderBy('createdAt','desc').onSnapshot(function(snap) {
    tasks = snap.docs.map(function(d){
      var data = d.data();
      // Ensure createdAt exists
      if (!data.createdAt) data.createdAt = new Date().toISOString();
      if (fbPendingTaskToggles[d.id]) data.done = fbPendingTaskToggles[d.id];
      return Object.assign({id:d.id}, data);
    }).filter(function(t){
      return !fbPendingTaskDeletes[t.id];
    });
    renderTasks();
    calRender();
"""
          new = """  fbUserDoc('tasks').orderBy('createdAt','desc').onSnapshot(function(snap) {
    var incomingTasks = snap.docs.map(function(d){
      var data = d.data();
      // Ensure createdAt exists
      if (!data.createdAt) data.createdAt = new Date().toISOString();
      if (fbPendingTaskToggles[d.id]) data.done = fbPendingTaskToggles[d.id];
      return Object.assign({id:d.id}, data);
    }).filter(function(t){
      return !fbPendingTaskDeletes[t.id];
    });

    /* Do not let an empty Firestore snapshot erase tasks that are already
       available locally while the one-time cloud load is still resolving. */
    if (!incomingTasks.length) {
      var localTasks = readJSON('zs_tasks_v3', []);
      if (tasks.length || (Array.isArray(localTasks) && localTasks.length)) {
        if (!tasks.length && Array.isArray(localTasks) && localTasks.length) {
          tasks = localTasks;
        }
        renderTasks();
        calRender();
        return;
      }
    }

    tasks = incomingTasks;
    renderTasks();
    calRender();
"""
          if old not in s:
              raise SystemExit('Expected task listener block not found; refusing to modify unrelated code.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Restore workflow file and commit only index.html
        run: |
          cat > .github/workflows/apply-hamburger.yml <<'YAML'
          name: Validate mobile UI

          on:
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4

                - name: Validate mobile scripts
                  run: |
                    python3 - <<'PY'
                    from pathlib import Path
                    index = Path('index.html').read_text(encoding='utf-8')
                    required = [
                        'mobile-enhancement.js',
                        'hamburger-modern.js',
                        'task-interaction-fix.js',
                    ]
                    missing = [x for x in required if x not in index]
                    if missing:
                        raise SystemExit('Missing mobile script tags: ' + ', '.join(missing))

                    mobile = Path('mobile-enhancement.js').read_text(encoding='utf-8')
                    forbidden = ['signInWithRedirect', 'fbSignIn', 'firebase.auth']
                    found = [x for x in forbidden if x in mobile]
                    if found:
                        raise SystemExit('mobile-enhancement.js contains auth override(s): ' + ', '.join(found))

                    print('Mobile UI validation passed; authentication remains in index.html.')
                    PY
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-hamburger.yml
          git commit -m "Fix empty Firestore snapshot erasing local tasks"
          git push
