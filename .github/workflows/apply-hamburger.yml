name: Validate mobile UI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate mobile scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          required = [
              'mobile-enhancement.js',
              'hamburger-modern.js',
              'task-interaction-fix.js',
          ]
          missing = [x for x in required if x not in index]
          if missing:
              raise SystemExit('Missing mobile script tags: ' + ', '.join(missing))

          mobile = Path('mobile-enhancement.js').read_text(encoding='utf-8')
          if 'signInWithRedirect' in mobile or 'fbSignIn' in mobile or 'firebase.auth' in mobile:
              raise SystemExit('mobile-enhancement.js must not contain authentication overrides')

          workflow = Path('.github/workflows/apply-hamburger.yml').read_text(encoding='utf-8')
          if 'git push' in workflow or 'contents: write' in workflow:
              raise SystemExit('Validation workflow must not write back to the repository')
          if 'signInWithRedirect' in workflow or 'Safari/iOS Firebase auth' in workflow:
              raise SystemExit('Validation workflow must not modify Firebase authentication')

          print('Mobile UI validation passed; auth remains owned by index.html.')
          PY
