name: Apply hamburger design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine mobile hamburger drawer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'HAMBURGER_SVG_MENU_V4'
          if marker in s:
              raise SystemExit(0)

          replacements = {
            '<div class="mob-drawer-item active" data-page="dashboard">🏠 Dashboard</div>': '<div class="mob-drawer-item active" data-page="dashboard"><span class="mob-menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></svg></span><span>Dashboard</span></div>',
            '<div class="mob-drawer-item" data-page="materials">📚 Materiály</div>': '<div class="mob-drawer-item" data-page="materials"><span class="mob-menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H20v15H7.5A2.5 2.5 0 0 0 5 20.5z"/><path d="M5 5.5v15M9 7h7M9 11h7"/></svg></span><span>Materiály</span></div>',
            '<div class="mob-drawer-item" data-page="evidence">📋 Evidence</div>': '<div class="mob-drawer-item" data-page="evidence"><span class="mob-menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h6M8 15h8M8 18h4"/></svg></span><span>Evidence</span></div>',
            '<div class="mob-drawer-item" data-page="dohledy">👁 Dohledy</div>': '<div class="mob-drawer-item" data-page="dohledy"><span class="mob-menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.8 12s3.4-5.7 9.2-5.7 9.2 5.7 9.2 5.7-3.4 5.7-9.2 5.7S2.8 12 2.8 12Z"/><circle cx="12" cy="12" r="2.6"/></svg></span><span>Dohledy</span></div>',
            '<div class="mob-drawer-item" data-page="settings">⚙️ Nastavení</div>': '<div class="mob-drawer-item" data-page="settings"><span class="mob-menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.7 2.1 2.7-.1.8 2.6 2.3 1.3-1.1 2.4 1.1 2.4-2.3 1.3-.8 2.6-2.7-.1L12 21l-1.7-2.1-2.7.1-.8-2.6-2.3-1.3 1.1-2.4 1.1-2.4-1.1-2.4 2.3-1.3.8-2.6 2.7.1z"/><circle cx="12" cy="12" r="3"/></svg></span><span>Nastavení</span></div>'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('Expected menu item not found: ' + old)
              s = s.replace(old, new, 1)

          css = '''
/* HAMBURGER_SVG_MENU_V4 */
@media (max-width: 600px) {
  .mob-drawer { width:min(330px,calc(100vw - 34px)) !important; max-width:330px !important; background:#fff !important; border:0 !important; border-radius:0 26px 26px 0 !important; box-shadow:18px 0 55px rgba(32,32,51,.18) !important; overflow:hidden !important; }
  .mob-drawer-hd { min-height:112px !important; padding:22px 20px !important; gap:13px !important; background:linear-gradient(180deg,#fff 0%,#faf9ff 100%) !important; border-bottom:1px solid #ececf4 !important; }
  #navLogoMob { width:50px !important; height:50px !important; border-radius:16px !important; box-shadow:0 7px 18px rgba(108,92,231,.18) !important; }
  .mob-drawer-hd > span { font-size:16px !important; line-height:1.2 !important; font-weight:750 !important; letter-spacing:-.025em !important; }
  .mob-drawer-close { width:40px !important; height:40px !important; margin-left:auto !important; padding:0 !important; border:0 !important; border-radius:13px !important; background:#f4f4f8 !important; color:#747a91 !important; font-size:19px !important; }
  .mob-drawer-nav { padding:16px 12px 22px !important; overflow-y:auto !important; }
  .mob-drawer-item { min-height:62px !important; width:100% !important; padding:8px 12px !important; margin:4px 0 !important; gap:13px !important; border-radius:16px !important; font-size:15px !important; font-weight:600 !important; color:#626a82 !important; background:transparent !important; }
  .mob-menu-icon { width:42px !important; height:42px !important; flex:0 0 42px !important; display:inline-flex !important; align-items:center !important; justify-content:center !important; border-radius:13px !important; background:#f4f4f8 !important; color:#747a91 !important; }
  .mob-menu-icon svg { width:21px !important; height:21px !important; fill:none !important; stroke:currentColor !important; stroke-width:1.7 !important; stroke-linecap:round !important; stroke-linejoin:round !important; }
  .mob-drawer-item.active { background:#f0eeff !important; color:#6c5ce7 !important; font-weight:700 !important; }
  .mob-drawer-item.active .mob-menu-icon { background:#6c5ce7 !important; color:#fff !important; box-shadow:0 5px 14px rgba(108,92,231,.22) !important; }
  .mob-drawer-item:not(.active):hover, .mob-drawer-item:not(.active):focus-visible { background:#f8f8fb !important; color:#202033 !important; }
}
'''
          close = s.lower().rfind('</style>')
          if close < 0:
              raise SystemExit('No style closing tag found')
          s = s[:close] + css + s[close:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit hamburger refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Hamburger already refined"
            exit 0
          fi
          git commit -m "style: refine mobile hamburger drawer"
          git push
