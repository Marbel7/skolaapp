name: Safari auth repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore stable auth block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start = text.find('// ── AUTH')
          end = text.find('// ===== NAČTENÍ VŠECH DAT =====')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Auth block markers not found')
          replacement = r'''// ── AUTH ──────────────────────────────────────────────────────────────────────
// Stable implementation: popup is started directly from the onclick handler.
// onAuthStateChanged is the single source of truth for the UI.
// Firebase compat defaults to LOCAL persistence in normal web browsers.

auth.getRedirectResult().then(function(result) {
  if (result && result.user) {
    console.log('[AUTH] getRedirectResult: user =', result.user.email);
  }
}).catch(function(err) {
  if (err.code !== 'auth/no-current-user') {
    console.warn('[AUTH] getRedirectResult error:', err.code);
  }
});

var fbUserId      = null;
var fbUserEmail   = null;
var fbSyncEnabled = false;

function fbUserDoc(col) {
  return db.collection('users').doc(fbUserId).collection(col);
}

function fbShowLoginOverlay() {
  document.getElementById('fbLoginOverlay').style.display = 'flex';
}
function fbHideLoginOverlay() {
  document.getElementById('fbLoginOverlay').style.display = 'none';
}

function fbSignIn() {
  var provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  auth.signInWithPopup(provider).catch(function(err) {
    console.error('[AUTH] signInWithPopup error:', err.code, err.message);
    var msg = null;
    switch (err.code) {
      case 'auth/popup-closed-by-user':
      case 'auth/cancelled-popup-request':
        break;
      case 'auth/popup-blocked':
        msg = 'Prohlížeč zablokoval přihlašovací okno. Povolte popupy pro tuto stránku.';
        break;
      case 'auth/unauthorized-domain':
        msg = 'Doména není povolena ve Firebase Console.';
        break;
      case 'auth/network-request-failed':
        msg = 'Chyba sítě. Zkontrolujte připojení.';
        break;
      default:
        msg = 'Chyba přihlášení: ' + (err.message || err.code);
    }
    if (msg) {
      if (typeof showToast === 'function') showToast('⚠️ ' + msg);
      else alert(msg);
    }
  });
}

function fbSignOut() {
  auth.signOut().catch(function(err) {
    console.error('[AUTH] signOut error:', err);
  });
}

auth.onAuthStateChanged(function(user) {
  if (user) {
    fbUserId      = user.uid;
    fbUserEmail   = user.email;
    fbSyncEnabled = true;

    fbHideLoginOverlay();
    fbSetupListeners();

    var info = document.getElementById('fbUserInfo');
    if (info) info.textContent = user.displayName || user.email;
    var btnIn  = document.getElementById('fbSignInBtn');
    var btnOut = document.getElementById('fbSignOutBtn');
    if (btnIn)  btnIn.style.display  = 'none';
    if (btnOut) btnOut.style.display = '';

    var av = document.getElementById('navAvatar');
    if (av) {
      if (user.photoURL) {
        av.innerHTML = '<img src="' + user.photoURL + '" style="width:34px;height:34px;border-radius:50%;object-fit:cover">';
      } else {
        av.textContent = (user.displayName || user.email || 'U').charAt(0).toUpperCase();
      }
    }
    var gr = document.getElementById('navGreet');
    if (gr) gr.textContent = 'Dobrý den, ' + (user.displayName ? user.displayName.split(' ')[0] : '') + ' 👋';

    fbLoadAll();
  } else {
    fbUserId      = null;
    fbUserEmail   = null;
    fbSyncEnabled = false;
    fbShowLoginOverlay();
  }
});

'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          print('Restored stable Firebase auth block')
          PY
      - name: Remove repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/safari-auth-repair.yml
          git commit -m "Restore stable Firebase authentication"
          git push origin HEAD:main
