name: Inject mobile shell after hamburger

on:
  workflow_run:
    workflows: ["Apply hamburger design"]
    types: [completed]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inject mobile enhancement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'mobile-enhancement.js'
          if marker in s:
              raise SystemExit(0)
          tag = '<script src="mobile-enhancement.js"></script>\n'
          lower = s.lower()
          pos = lower.rfind('</body>')
          if pos < 0:
              pos = lower.rfind('</html>')
          if pos < 0:
              raise SystemExit('No closing html tag found')
          p.write_text(s[:pos] + tag + s[pos:], encoding='utf-8')
          PY

      - name: Commit injection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Mobile shell already injected"
            exit 0
          fi
          git commit -m "feat: enable native mobile quick capture"
          git push
