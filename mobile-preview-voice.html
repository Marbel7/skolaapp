<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F7FA"><title>SkolaApp — hlasové zachycení</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#f7f7fa}iframe{width:100%;height:100%;border:0}</style></head>
<body>
<iframe id="app" allow="microphone" src="index.html"></iframe>
<script>
const f=document.getElementById('app');f.addEventListener('load',()=>{const d=f.contentDocument;
const css=d.createElement('style');css.textContent=`@media(max-width:700px){body{padding-bottom:92px!important;overflow-x:hidden!important}.nav-tabs,.nav-name,.nav-bell{display:none!important}.nav{height:58px!important;padding:0 16px!important}.nav-right{margin-left:auto}.page{max-width:none!important;padding:20px 14px 28px!important}.stats{grid-template-columns:repeat(3,1fr)!important;gap:8px!important}.grid2{grid-template-columns:1fr!important}.card{border-radius:14px!important}.vq{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:70px;background:rgba(255,255,255,.96);backdrop-filter:blur(22px);border:1px solid #e8e8f0;border-radius:23px;box-shadow:0 12px 38px rgba(32,32,51,.14);z-index:9999;display:flex;align-items:center;justify-content:center}.vqb{width:62px;height:62px;margin-top:-19px;border:0;border-radius:21px;background:#6C5CE7;color:#fff;box-shadow:0 10px 24px rgba(108,92,231,.32);font:700 11px Inter,sans-serif}.vo{position:fixed;inset:0;background:rgba(20,20,35,.48);backdrop-filter:blur(8px);z-index:10000;display:none;align-items:flex-end}.vo.open{display:flex}.vs{width:100%;box-sizing:border-box;background:#fff;border-radius:28px 28px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom))}.vg{width:38px;height:4px;background:#dad ae5;border-radius:9px;margin:0 auto 15px}.vt{font:700 21px Inter,sans-serif;color:#202033}.vsub{font:13px Inter,sans-serif;color:#7c8198;margin:4px 0 15px}.vm{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f4f4f8;padding:4px;border-radius:13px;margin-bottom:11px}.vm button{height:38px;border:0;border-radius:10px;background:transparent;font:700 12px Inter,sans-serif;color:#7c8198}.vm .on{background:#fff;color:#6c5ce7}.vrec{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid #e8e8f0;border-radius:14px;background:#fcfcfe}.vmi{width:38px;height:38px;border-radius:12px;background:#f0eeff;color:#6c5ce7;display:flex;align-items:center;justify-content:center;font-size:21px}.vrec.on .vmi{background:#6c5ce7;color:#fff}.vc strong{display:block;font:700 12px Inter,sans-serif;color:#202033}.vc span{font:11px Inter,sans-serif;color:#7c8198}.vtxt{width:100%;box-sizing:border-box;min-height:100px;margin-top:10px;border:1px solid #e8e8f0;border-radius:15px;padding:13px;font:500 16px/1.45 Inter,sans-serif;outline:0}.vact{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:10px}.vact button{height:48px;border-radius:13px;border:1px solid #e8e8f0;font:700 14px Inter,sans-serif}.vsave{background:#6c5ce7;color:#fff!important;border-color:#6c5ce7!important}.vmsg{display:none;margin-top:9px;padding:9px 11px;border-radius:11px;background:#fff7e9;color:#9a671a;font:500 11px/1.35 Inter,sans-serif}.vmsg.on{display:block}.vh{font:10px Inter,sans-serif;color:#a8abbe;text-align:center;margin-top:9px}}@media(min-width:701px){.vq,.vo{display:none!important}}`;d.head.appendChild(css);
const ov=d.createElement('div');ov.className='vo';ov.innerHTML=`<div class="vs"><div class="vg"></div><div class="vt">Rychlé zachycení</div><div class="vsub">Řekni nebo napiš, co si nechceš nechat utéct.</div><div class="vm"><button class="on" id="t">Úkol</button><button id="n">Myšlenka</button></div><div class="vrec" id="r"><div class="vmi">🎙️</div><div class="vc"><strong id="rt">Namluvit</strong><span id="rc">Klepni a začni mluvit</span></div></div><textarea class="vtxt" id="x" placeholder="Např. zkontrolovat rozvrh 6.B…"></textarea><div class="vact"><button id="c">Zrušit</button><button class="vsave" id="s">Uložit</button></div><div class="vmsg" id="m"></div><div class="vh">Po zastavení se řeč převede na upravitelný text.</div></div>`;d.body.appendChild(ov);
const q=d.createElement('div');q.className='vq';q.innerHTML='<button class="vqb" id="q">🎙️<br>Zachytit</button>';d.body.appendChild(q);
const r=ov.querySelector('#r'),x=ov.querySelector('#x'),m=ov.querySelector('#m'),rt=ov.querySelector('#rt'),rc=ov.querySelector('#rc');let rec=null,on=false,final='';
function start(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){m.textContent='Tento prohlížeč nepodporuje Web Speech. Otevři stránku přímo v Safari a zapni Diktování/Siri.';m.classList.add('on');return}m.classList.remove('on');rec=new SR();rec.lang='cs-CZ';rec.continuous=true;rec.interimResults=true;final=x.value.trim();if(final)final+=' ';rec.onstart=()=>{on=true;r.classList.add('on');rt.textContent='Poslouchám…';rc.textContent='Klepni znovu pro zastavení'};rec.onresult=e=>{let i='';for(let j=e.resultIndex;j<e.results.length;j++){if(e.results[j].isFinal)final+=e.results[j][0].transcript+' ';else i+=e.results[j][0].transcript}x.value=(final+i).trim()};rec.onerror=e=>{on=false;r.classList.remove('on');m.textContent=e.error==='not-allowed'||e.error==='service-not-allowed'?'Mikrofon nebyl povolen. Povol mikrofon pro tento web.':'Hlasový vstup skončil s chybou: '+e.error;m.classList.add('on')};rec.onend=()=>{if(on){on=false;r.classList.remove('on');rt.textContent='Namluvit';rc.textContent='Klepni a začni mluvit'}};try{rec.start()}catch(e){m.textContent='Hlasový vstup se nepodařilo spustit. Zkus to znovu.';m.classList.add('on')}}
function stop(){if(rec){try{rec.stop()}catch(e){}rec=null}on=false;r.classList.remove('on');rt.textContent='Namluvit';rc.textContent='Klepni a začni mluvit'}
r.onclick=()=>on?stop():start();q.querySelector('#q').onclick=()=>{ov.classList.add('open');setTimeout(()=>x.focus(),100)};ov.querySelector('#c').onclick=()=>{stop();ov.classList.remove('open');x.value='';final='';m.classList.remove('on')};ov.addEventListener('click',e=>{if(e.target===ov)ov.querySelector('#c').click()});ov.querySelector('#s').onclick=()=>{const v=x.value.trim();if(!v)return;const i=d.getElementById('taskInput'),b=d.getElementById('taskAddBtn');if(i&&b){i.value=v;b.click()}stop();ov.querySelector('#c').click()};
});
</script></body></html>
